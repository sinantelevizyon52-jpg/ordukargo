<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün Fiyat Hesaplama</title>
<style>
    /* Temel arka plan ve yazı stili */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #4a90e2 0%, #003366 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 50px;
    }

    .container {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 15px;
        width: 90%;
        max-width: 900px;
        box-shadow: 0 12px 35px rgba(0, 51, 102, 0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    input, select, button {
        padding: 10px;
        margin: 5px 0;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    input, select {
        width: calc(100% - 22px);
    }

    button {
        background-color: #1e90ff;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #63b3ed;
    }

    .product-list {
        max-height: 300px;
        overflow-y: auto;
        margin-top: 15px;
        background: rgba(0,0,0,0.1);
        padding: 10px;
        border-radius: 10px;
    }

    .product-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .result {
        margin-top: 15px;
        padding: 10px;
        background: rgba(0,0,0,0.2);
        border-radius: 10px;
        font-size: 18px;
        text-align: center;
    }

    /* Arama input'u özel */
    #searchInput {
        width: calc(100% - 120px);
        display: inline-block;
    }

    #searchBtn {
        width: 100px;
        display: inline-block;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Ürün Fiyat Hesaplama</h1>

    <!-- Ürün ekleme -->
    <input type="text" id="productName" placeholder="Ürün adı girin">
    <input type="number" id="productDesi" placeholder="Desi girin">
    <select id="category">
        <option value="elektronik">Elektronik</option>
        <option value="tekstil">Tekstil</option>
        <option value="metal">Metal</option>
        <option value="plastik">Plastik</option>
    </select>
    <button onclick="addProduct()">Ekle</button>

    <!-- Arama -->
    <div style="margin-top:10px;">
        <input type="text" id="searchInput" placeholder="Ürün ara...">
        <button id="searchBtn" onclick="searchProduct()">Ara</button>
    </div>

    <!-- Ürün listesi -->
    <div class="product-list" id="productList"></div>

    <!-- Sonuç -->
    <div class="result" id="result">Fiyat: 0 TL</div>
</div>

<script>
    let products = [];

    // Kategoriye göre fiyat çarpanı
    const categoryMultiplier = {
        elektronik: 1.2,
        tekstil: 1.1,
        metal: 1.3,
        plastik: 1.0
    };

    function addProduct() {
        const name = document.getElementById('productName').value.trim();
        const desi = parseFloat(document.getElementById('productDesi').value);
        const category = document.getElementById('category').value;

        if(!name || isNaN(desi)) {
            alert('Lütfen ürün adı ve desi girin!');
            return;
        }

        const product = { name, desi, category };
        products.push(product);
        document.getElementById('productName').value = '';
        document.getElementById('productDesi').value = '';

        displayProducts(products);
        calculatePrice(product);
    }

    function displayProducts(list) {
        const container = document.getElementById('productList');
        container.innerHTML = '';
        list.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'product-item';
            div.innerHTML = `<span>${p.name} (${p.category}) - ${p.desi} desi</span>`;
            container.appendChild(div);
        });
    }

    function calculatePrice(product) {
        const multiplier = categoryMultiplier[product.category] || 1;
        const price = product.desi * 10 * multiplier; // temel oran: 10 TL/desi
        document.getElementById('result').innerText = `Fiyat: ${price.toFixed(2)} TL (${product.category})`;
    }

    function searchProduct() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(query));
        displayProducts(filtered);
    }
</script>

</body>
</html>
