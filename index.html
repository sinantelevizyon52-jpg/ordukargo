<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ORDU Kargo Hesaplama ve Hazır Ürün Sepeti</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: YENİ MAVİ-KIRMIZI KURUMSAL TEMA (GÖLGELİ VE MODERN) */
        :root{
            --primary: #003366; 
            --accent: #CC0000; 
            --light-bg: #FFFFFF; 
            --text-color: #333;
            --input-border: #ADD8E6;
            --hover-dark: #002244;
            --light-gray: #f5f5f5;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px; 
            background-color: var(--primary);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            box-sizing: border-box;
            font-size: 14px;
        }
        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: var(--accent);
            padding: 15px 0;
            color: white;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px 12px 0 0;
            /* GÖLGE BURADA: 3D etkiyi verir. */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); 
        }
        .header a {
            color: white;
            text-decoration: none;
            display: block;
        }
        .container {
            margin: 0 auto;
            padding: 25px;
            background-color: var(--light-bg);
            border-radius: 0 0 12px 12px;
            /* GÖLGE BURADA: 3D etkiyi verir. */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            text-align: left;
            position: relative;
            min-height: 500px; 
        }
        
        /* ... Geri Kalan CSS Kodları ... */
        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-group:not(.desi-input-group)::before {
            content: '📐';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        .desi-input-group::before {
            content: '🔢';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            -webkit-appearance: none;
            transition: border-color .2s;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .18s, transform .1s;
            touch-action: manipulation;
            /* GÖLGE BURADA: 3D etkiyi verir. */
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4); 
            margin-top: 5px;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(204, 0, 0, 0.4);
        }
        button:hover { background-color: var(--hover-dark); }
