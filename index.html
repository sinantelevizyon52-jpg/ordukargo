    <style>
        /* CSS: YENİ MAVİ-KIRMIZI KURUMSAL TEMA */
        :root{
            --primary: #003366; /* Koyu Mavi */
            --accent: #CC0000; /* Kırmızı Vurgu */
            --light-bg: #FFFFFF; /* İç Alan Arka Planı (Beyaz) */
            --text-color: #333;
            --input-border: #ADD8E6; /* Açık Mavi Kenarlık */
            --hover-dark: #002244; /* Daha Koyu Mavi (Hover/Vurgu) */
            --light-gray: #f5f5f5;
        }
        html,body{
            height:100%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary); /* Ana zemin Koyu Mavi */
            color: var(--text-color);
            -webkit-font-smoothing:antialiased;
            text-align: center;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: 20px;
            box-sizing:border-box;
            font-size: 14px; /* Global font size düşürüldü */
        }
        .app {
            width:100%;
            max-width:420px;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: var(--accent); /* Başlık Kırmızı */
            padding: 15px 0;
            color: white;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .header a {
            color: white;
            text-decoration: none;
            display: block;
        }
        .container {
            margin: 0 auto;
            padding: 25px;
            background-color: var(--light-bg); /* İç Alan Beyaz */
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
            position: relative;
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-group:not(.desi-input-group)::before {
            content: '📐';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        .desi-input-group::before {
            content: '🔢';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            -webkit-appearance: none;
            transition: border-color .2s;
        }
