<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ORDU Kargo Hesaplama</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="📦 Kargo Hesapla">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20251124">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=20251124">

    <style>
        /* CSS: YENİ MAVİ-KIRMIZI KURUMSAL TEMA */
        :root{
            --primary: #003366; /* Koyu Mavi */
            --accent: #CC0000; /* Kırmızı Vurgu */
            --light-bg: #FFFFFF; /* İç Alan Arka Planı (Beyaz) */
            --text-color: #333;
            --input-border: #ADD8E6; /* Açık Mavi Kenarlık */
            --hover-dark: #002244; /* Daha Koyu Mavi (Hover/Vurgu) */
        }
        html,body{
            height:100%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary); /* Ana zemin Koyu Mavi */
            color: var(--text-color);
            -webkit-font-smoothing:antialiased;
            text-align: center;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: 20px;
            box-sizing:border-box;
        }
        .app {
            width:100%;
            max-width:420px;
        }
        .header {
            background-color: var(--accent); /* Başlık Kırmızı */
            color: white;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            
            /* 🔥🔥🔥 IOS GÜVENLİ ALAN DÜZELTMESİ YAPILDI 🔥🔥🔥 */
            padding-top: calc(15px + env(safe-area-inset-top, 0px)); /* Üst çentik mesafesi kadar ek boşluk */
            padding-bottom: 15px; /* Alt boşluk sabit */
            padding-left: 0;
            padding-right: 0;
            border-radius: 0; /* Yuvarlak köşeler kaldırıldı ki renk ekranın tepesine kadar dolsun */
        }
        /* Başlık içindeki linkin stilini ayarlama */
        .header a {
            color: white;
            text-decoration: none; /* Link altındaki çizgiyi kaldır */
            display: block; /* Linkin tüm header alanını kaplamasını sağla */
        }
        .container {
            margin: 0 auto;
            padding: 25px;
            background-color: var(--light-bg); /* İç Alan Beyaz */
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        h2 {
            color: var(--primary); /* Başlık Mavi */
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }
        /* Giriş Alanı Gruplaması */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        /* En/Boy/Yükseklik için ikon */
        .input-group:not(.desi-input-group)::before {
            content: '📐'; /* Cetvel/Ölçü emojisi */
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px; 
            z-index: 10;
        }
        /* Desi girişi için ikon */
        .desi-input-group::before {
            content: '🔢'; /* Numara emojisi */
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px; 
            z-index: 10;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 45px; /* İkon için soldan boşluk */
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            -webkit-appearance: none;
            transition: border-color .2s;
        }
        input[type="number"]:focus {
            border-color: var(--primary); /* Focus Mavi */
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent); /* Buton Kırmızı */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .18s, transform .1s;
            touch-action: manipulation;
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4); 
            margin-top: 5px;
        }
        button:active { 
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(204, 0, 0, 0.4);
        }
        button:hover { background-color: var(--hover-dark); } /* Hover Koyu Mavi */

        .result-box {
            margin-top: 22px;
            padding: 18px;
            border: 2px solid var(--accent);
            background-color: #fff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2); 
        }
        .result-box p { margin: 6px 0; font-size: 16px; color: var(--text-color); }
        .result-box h3 { color: var(--accent); margin: 8px 0 0; font-size: 20px; font-weight: 700; } /* Ücret Kırmızı */

        .footer {
            margin-top: 14px;
            padding: 6px;
            color: #ddd; 
            font-size: 12px;
            text-align: center;
        }
        
        /* Mobil uyum */
        @media (max-width:420px) {
            .container { padding: 20px; }
            button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Kargo Ücreti Hesaplayıcı">
        <div class="header">
            <a href="http://www.ordutasimacilik.com" target="_blank">www.ordutasimacilik.com</a>
        </div>

        <div class="container" role="main">
            
            <p style="font-size:14px; text-align:center; margin-bottom:20px; color:#666;">
                Kargo Fiyatı Hesaplama
            </p>
