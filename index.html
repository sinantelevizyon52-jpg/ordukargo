<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ORDU Kargo Hesaplama ve Hazır Ürün Sepeti</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: YENİ MAVİ-KIRMIZI KURUMSAL TEMA */
        :root{
            --primary: #003366; /* Koyu Mavi */
            --accent: #CC0000; /* Kırmızı Vurgu */
            --light-bg: #FFFFFF; /* İç Alan Arka Planı (Beyaz) */
            --text-color: #333;
            --input-border: #ADD8E6;
            --hover-dark: #002244;
            --light-gray: #f5f5f5;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px; 
            background-color: var(--primary);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            box-sizing: border-box;
            font-size: 14px;
        }
        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: var(--accent);
            padding: 15px 0;
            color: white;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .header a {
            color: white;
            text-decoration: none;
            display: block;
        }
        .container {
            margin: 0 auto;
            padding: 25px;
            background-color: var(--light-bg);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
            position: relative;
            min-height: 500px;
        }
        
        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        /* Boyut inputlarına ikon */
        .input-group:not(.desi-input-group):not(.arama-input-group)::before {
            content: '📐';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        .desi-input-group::before {
            content: '🔢';
            font-size: 20px;
            position: absolute;
            left: 12px;
            top: 10px;
            z-index: 10;
        }
        /* Arama kutusu için ikon stili */
        .arama-input-group::before {
             content: '🔍' !important; /* Arama ikonu */
             top: 34px !important; /* Pozisyonu ayarla */
             left: 12px !important; 
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            -webkit-appearance: none;
            transition: border-color .2s;
        }
        input[type="text"] {
             width: 100%;
            padding: 10px 14px 10px 40px; 
            border: 1px solid var(--input-border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .18s, transform .1s;
            touch-action: manipulation;
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4);
            margin-top: 5px;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(204, 0, 0, 0.4);
        }
        button:hover { background-color: var(--hover-dark); } 

        .hazir-urunler-tablo {
            margin-top: 25px;
            background-color: var(--light-gray);
            border-radius: 10px;
            padding: 10px;
        }
        .hazir-urunler-tablo h3 {
            color: var(--primary);
            margin: 0 0 15px 0;
            text-align: center;
        }
        .urun-listesi-kapsayici {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            margin-top: 5px; 
        }
        .urun-tablosu {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .urun-tablosu th, .urun-tablosu td {
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            text-align: right;
        }
        .urun-tablosu th:nth-child(1), .urun-tablosu td:nth-child(1) {
            text-align: left;
            font-weight: 600;
        }
        .urun-tablosu th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
        }
        .urun-tablosu tr:nth-child(even) {
            background-color: #fafafa;
        }
        .urun-tablosu input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin: 0;
        }
        .result-box {
            margin-top: 22px;
            padding: 18px;
            border: 2px solid var(--accent);
            background-color: #fff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2);
        }
        .sonuc-gosterge {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #ddd;
        }
        .sonuc-gosterge:last-child {
            border-bottom: none;
            margin-top: 10px;
        }
        .sonuc-gosterge span {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            text-align: left;
        }
        /* JS ile kontrol edilecektir, CSS ile başlangıçta gizlenmeyecek */
        .manuel-hesap-sonuc, .sepet-hesap-sonuc {
            display: none; 
            text-align: left;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--input-border);
        }
        .sepet-hesap-sonuc {
            border-bottom: none;
        }
        .footer {
            margin-top: 14px;
            padding: 6px;
            color: #ddd;
            font-size: 12px;
            text-align: center;
        }
        @media (max-width:420px) {
            .container { padding: 20px; }
            button { padding: 14px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Kargo Ücreti Hesaplayıcı">
        <div class="header">
            <a href="http://www.ordutasimacilik.com" target="_blank">www.ordutasimacilik.com</a>
        </div>

        <div class="container" role="main">
            
            <p style="font-size:18px; font-weight: 700; text-align:center; margin-bottom:20px; color:var(--primary);">
                ORDU TAŞIMACILIK
            </p>

            <div id="lwh-group">
                <div class="input-group">
                    <label for="en">En (cm)</label>
                    <input type="number" id="en" placeholder="Örn: 30" inputmode="numeric" min="0" step="any">
                </div>

                <div class="input-group">
                    <label for="boy">Boy (cm)</label>
                    <input type="number" id="boy" placeholder="Örn: 30" inputmode="numeric" min="0" step="any">
                </div>

                <div class="input-group">
                    <label for="yukseklik">Yükseklik (cm)</label>
                    <input type="number" id="yukseklik" placeholder="Örn: 40" inputmode="numeric" min="0" step="any">
                </div>

                <button id="hesapBtnLWH">Hacim ile Fiyatı Hesapla</button>
            </div>

            <hr style="margin:25px 0; border-top:1px solid var(--input-border);">
            <h3 style="text-align:center; color:var(--primary); margin-bottom:15px; font-weight:600;">🔢 Ya da Desiyi Direkt Girin</h3>

            <div class="input-group desi-input-group">
                <label for="desi">Desi Değeri (Adet)</label>
                <input type="number" id="desi" placeholder="Örn: 12" inputmode="numeric" min="0" step="1">
            </div>
            
            <button id="hesapBtnDesi">Desi ile Fiyatı Hesapla</button>

            <div class="hazir-urunler-tablo">
                <hr style="margin:25px 0; border-top:1px solid var(--input-border); border-color:var(--primary);">
                <h3>📦 Hazır Ürün Seçimi - Ekipman ve Tekstil (3000 Bölen)</h3>

                <div class="input-group arama-input-group" style="margin-bottom: 15px;">
                    <label for="urunArama" style="font-style: italic;">Ürün Ara...</label>
                    <input type="text" id="urunArama" placeholder="Örn: Jant veya Televizyon">
                </div>
                <div class="urun-listesi-kapsayici">
                    <table id="urun-tablosu" class="urun-tablosu">
                        <thead>
                            <tr>
                                <th style="width: 45%;">Ürün Adı</th>
                                <th style="width: 20%;">Desi</th>
                                <th style="width: 20%;">Fiyat</th>
                                <th
