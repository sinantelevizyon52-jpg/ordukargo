<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ORDU Kargo Hesaplama</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="📦 Kargo Hesapla">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20251124">
    <link rel="icon" type="image/png" href="apple-touch-icon.png?v=20251124">

    <style>
        /* CSS: YENİ MAVİ-KIRMIZI KURUMSAL TEMA */
        :root{
            --primary: #003366; /* Koyu Mavi */
            --accent: #CC0000; /* Kırmızı Vurgu */
            --light-bg: #FFFFFF; /* İç Alan Arka Planı (Beyaz) */
            --text-color: #333;
            --input-border: #ADD8E6; /* Açık Mavi Kenarlık */
            --hover-dark: #002244; /* Daha Koyu Mavi (Hover/Vurgu) */
            --sepet-bg: #e6f7ff; /* Açık Mavi Sepet Arka Planı */
        }
        html,body{
            height:100%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--primary); 
            color: var(--text-color);
            -webkit-font-smoothing:antialiased;
            text-align: center;
            display:flex;
            align-items:center;
            justify-content:center;
            padding: 20px;
            box-sizing:border-box;
        }
        .app {
            width:100%;
            max-width:420px;
        }
        .header {
            background-color: var(--accent); 
            padding: 15px 0;
            color: white;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        .header a {
            color: white;
            text-decoration: none; 
            display: block; 
        }
        .container {
            margin: 0 auto;
            padding: 25px;
            background-color: var(--light-bg); 
            border-radius: 0 0 12px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: left;
        }
        /* Sekme Başlıkları */
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            background-color: #f0f0f0; 
            color: var(--text-color);
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary); 
            color: white;
            pointer-events: none; 
        }

        /* Giriş Alanı Gruplaması (Mevcut korundu) */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            -webkit-appearance: none;
            transition: border-color .2s;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent); 
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color .18s, transform .1s;
            touch-action: manipulation;
            box-shadow: 0 4px 12px rgba(204, 0, 0, 0.4); 
            margin-top: 5px;
        }
        /* Yeni: Sepete Ekle Butonu */
        .add-to-cart-btn {
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 0;
            border-radius: 8px;
            background-color: var(--primary);
            box-shadow: none;
        }
        .add-to-cart-btn:hover {
            background-color: var(--hover-dark);
        }

        /* Yeni: Hazır Ürün Listesi Stili */
        .product-list {
            list-style: none;
            padding: 0;
        }
        /* Ürün fiyatını biraz ayırmak için */
        .product-list .product-info {
            display: flex;
            flex-direction: column;
        }
        .product-list .product-info span:last-child {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
        }

        .product-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .product-list li:last-child {
            border-bottom: none;
        }

        /* Yeni: Sepetim Kutusu Stili */
        .cart-box {
            background-color: var(--sepet-bg);
            border: 1px solid #b3e0ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            display: none; /* Başlangıçta gizli */
        }
        .cart-box h4 {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            font-size: 16px;
        }
        .cart-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .cart-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #333;
        }
        .cart-list li button {
            all: unset;
            cursor: pointer;
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
        }

        .cart-summary {
            font-weight: 700;
            border-top: 1px solid #ccc;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
        }

        /* Sonuç Kutusu */
        .result-box {
            margin-top: 22px;
            padding: 18px;
            border: 2px solid var(--accent);
            background-color: #fff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2); 
        }
        .result-box p { margin: 6px 0; font-size: 16px; color: var(--text-color); }
        .result-box h3 { color: var(--accent); margin: 8px 0 0; font-size: 20px; font-weight: 700; } 

        /* İkon Stilleri (Mevcut korundu) */
        .input-group:not(.desi-input-group):not(.kg-input-group)::before { content: '📐'; font-size: 20px; position: absolute; left: 12px; top: 10px; z-index: 10; }
        .desi-input-group::before { content: '🔢'; font-size: 20px; position: absolute; left: 12px; top: 10px; z-index: 10; }
        .kg-input-group::before { content: '⚖️'; font-size: 20px; position: absolute; left: 12px; top: 10px; z-index: 10; }
        
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Kargo Ücreti Hesaplayıcı">
        <div class="header">
            <a href="http://www.ordutasimacilik.com" target="_blank">www.ordutasimacilik.com</a>
        </div>

        <div class="container" role="main">
            
            <p style="font-size:18px; font-weight: 700; text-align:center; margin-bottom:20px; color:var(--primary);">
                ORDU TAŞIMACILIK
            </p>

            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="tabOzelFiyat">Özel Fiyat Hesapla</button>
                <button class="tab-btn" data-tab="tabHazirFiyat">Hazır Ürün Sepeti</button>
            </div>


            <div id="tabOzelFiyat" class="tab-content">
                 
                <div id="lwh-group">
                    <div class="input-group">
                        <label for="en">En (cm)</label>
                        <input type="number" id="en" placeholder="Örn: 30" inputmode="numeric" min="0" step="any">
                    </div>

                    <div class="input-group">
                        <label for="boy">Boy (cm)</label>
                        <input type="number" id="boy" placeholder="Örn: 30" inputmode="numeric" min="0" step="any">
                    </div>

                    <div class="input-group">
                        <label for="yukseklik">Yükseklik (cm)</label>
                        <input type="number" id="yukseklik" placeholder="Örn: 40" inputmode="numeric" min="0" step="any">
                    </div>

                    <div class="input-group kg-input-group">
                        <label for="agirlik">Ağırlık (kg)</label>
                        <input type="number" id="agirlik" placeholder="Örn: 5" inputmode="numeric" min="0" step="any">
                    </div>

                    <button id="hesapBtnLWH">Hacim ve Ağırlık ile Fiyatı Hesapla</button>
                </div>


                <hr style="margin:25px 0; border-top:1px solid var(--input-border);">
                <h3 style="text-align:center; color:var(--primary); margin-bottom:15px; font-weight:600;">🔢 Ya da Desiyi Direkt Girin</h3>

                <div class="input-group desi-input-group">
                    <label for="desi">Desi
